name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pipeline is standard library only, so there is nothing to install.
      - name: Compile every module
        run: python -m compileall -q code tests

      # Unit tests cover the parsing rules; the dataset tests check the
      # committed CSVs join, stay inside their documented value domains, and
      # still meet the counts Lambert states in his own preface. Neither needs
      # network access or the 76 MB ALTO cache.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Regenerate the validation report and check it is up to date
        run: |
          python code/pipeline/validate.py
          git diff --exit-code -- docs/validation_report.md \
            || { echo "::error::docs/validation_report.md is stale — run 'make validate' and commit"; exit 1; }

      # This stage used to import networkx, so `make all` failed for anyone who
      # followed the README and installed nothing. CI never ran it, which is why
      # nobody noticed. It runs here now, on a runner with no dependencies
      # installed, so the pipeline's standard-library-only promise is enforced
      # rather than merely stated.
      - name: Regenerate the comparison tables and check they are up to date
        run: |
          python code/pipeline/compare_populations.py > /dev/null
          git diff --exit-code -- output/tables/comparison_tables.md \
            || { echo "::error::output/tables/comparison_tables.md is stale — run 'make compare' and commit"; exit 1; }

      - name: Regenerate the network measures and check they are up to date
        run: |
          python code/pipeline/network_measures.py > /dev/null
          git diff --exit-code -- data/processed/person_network_measures.csv \
            || { echo "::error::data/processed/person_network_measures.csv is stale — run 'make measures' and commit"; exit 1; }

      - name: Smoke-test the example
        run: python code/examples/quickstart.py > /dev/null
