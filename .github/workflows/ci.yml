name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pipeline is standard library only, so there is nothing to install.
      - name: Compile every module
        run: python -m compileall -q src examples tests

      # Unit tests cover the parsing rules; the dataset tests check the
      # committed CSVs join, stay inside their documented value domains, and
      # still meet the counts Lambert states in his own preface. Neither needs
      # network access or the 76 MB ALTO cache.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Regenerate the validation report and check it is up to date
        run: |
          python src/validate.py
          git diff --exit-code -- docs/validation_report.md \
            || { echo "::error::docs/validation_report.md is stale — run 'make validate' and commit"; exit 1; }

      - name: Smoke-test the example
        run: python examples/quickstart.py > /dev/null
